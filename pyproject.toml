[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-decision"
dynamic = ["version"]
description = "Run and fine-tune decision models locally on Apple Silicon with MLX, from Python, the command line, a Jev-compatible server or the Studio in your browser"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Armin Buescher" }]
keywords = [
    "mlx",
    "apple-silicon",
    "decision-model",
    "classification",
    "fine-tuning",
    "studio",
    "clef",
    "qwen",
    "llm",
    "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: GPU",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.32.4",
    "tokenizers>=0.21",
    "huggingface_hub>=1.1,<3",
    "httpx>=0.27",
    "prompt_toolkit>=3.0.52",
    "pydantic>=2.7",
    "typer>=0.27",
    # The server and the Studio (mlx-decision server, web); zstd for request
    # bodies the Jev SDK compresses, in the standard library from 3.14.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "backports.zstd>=1.0; python_version < '3.14'",
    # Image input.
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
training = ["datasets>=3.0"]
all = ["mlx-decision[mcp,training]"]
# Part of the base install since 1.0; kept empty so older install lines still work.
server = []
web = []
images = []
dev = ["mlx-decision[all]", "pytest", "pyte", "playwright", "ruff", "build", "twine"]

[project.urls]
Homepage = "https://github.com/armbues/mlx-decision"
Repository = "https://github.com/armbues/mlx-decision"
Issues = "https://github.com/armbues/mlx-decision/issues"
Changelog = "https://github.com/armbues/mlx-decision/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mlx_decision/__init__.py"

[tool.hatch.build.targets.sdist]
# The README's screenshots are served from GitHub; the wheel never had them.
exclude = ["docs/images"]

[project.scripts]
mlx-decision = "mlx_decision.cli:entry"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Copied from mlx-lm and mlx-vlm, and d1-2B's prompt and readout from their own
# project; kept close to their sources so they can be diffed.
extend-exclude = [
    "src/mlx_decision/models/d1lfm3/prompt.py",
    "src/mlx_decision/models/d1lfm3/readout.py",
    "src/mlx_decision/backbones/lfm2/lfm2.py",
    "src/mlx_decision/backbones/lfm3/config.py",
    "src/mlx_decision/backbones/lfm3/language.py",
    "src/mlx_decision/backbones/lfm3/lfm3_vl.py",
    "src/mlx_decision/backbones/lfm3/vision.py",
    "src/mlx_decision/backbones/lfm3/vl_config.py",
    "src/mlx_decision/backbones/qwen3_5/activations.py",
    "src/mlx_decision/backbones/qwen3_5/base.py",
    "src/mlx_decision/backbones/qwen3_5/cache.py",
    "src/mlx_decision/backbones/qwen3_5/gated_delta.py",
    "src/mlx_decision/backbones/qwen3_5/qwen3_5.py",
    "src/mlx_decision/backbones/qwen3_5/qwen3_next.py",
    "src/mlx_decision/backbones/qwen3_5/rope_utils.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow and browser tests run only when asked for: pytest -m slow (make
# test-slow), pytest -m browser (make test-browser).
addopts = "-m 'not slow and not browser'"
markers = [
    "weights: needs the model weights (skipped when they are absent)",
    "slow: takes minutes; deselected unless asked for with -m slow",
    "browser: drives the Studio in Chrome (Playwright); deselected unless asked for with -m browser",
]
