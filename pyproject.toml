[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-decision"
version = "0.3.0"
description = "Run and train decision models on Apple Silicon with MLX"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = [
    "mlx>=0.32",
    "tokenizers",
    "huggingface_hub",
    "prompt_toolkit>=3",
    "pydantic>=2",
    "typer",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]
images = ["pillow", "numpy"]
dev = ["mlx-decision[server,images]", "pytest", "ruff", "httpx", "build", "twine"]

[project.scripts]
mlx-decision = "mlx_decision.cli:app"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Copied from mlx-lm; kept close to upstream so they can be diffed.
extend-exclude = [
    "src/mlx_decision/backbones/qwen3_5/activations.py",
    "src/mlx_decision/backbones/qwen3_5/base.py",
    "src/mlx_decision/backbones/qwen3_5/gated_delta.py",
    "src/mlx_decision/backbones/qwen3_5/qwen3_5.py",
    "src/mlx_decision/backbones/qwen3_5/qwen3_next.py",
    "src/mlx_decision/backbones/qwen3_5/rope_utils.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["weights: needs the model weights (skipped when they are absent)"]
