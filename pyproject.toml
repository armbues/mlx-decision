[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-decision"
dynamic = ["version"]
description = "Run decision models such as Cloudflare's Clef locally on Apple Silicon with MLX"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Armin Buescher" }]
keywords = [
    "mlx",
    "apple-silicon",
    "decision-model",
    "classification",
    "clef",
    "qwen",
    "llm",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.32",
    "tokenizers>=0.21",
    "huggingface_hub>=1.0",
    "httpx>=0.27",
    "prompt_toolkit>=3.0.52",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
images = ["pillow>=10", "numpy>=1.26"]
mcp = ["mcp>=2.3,<3"]
dev = ["mlx-decision[server,images,mcp]", "pytest", "ruff", "build", "twine"]

[project.urls]
Homepage = "https://github.com/armbues/mlx-decision"
Repository = "https://github.com/armbues/mlx-decision"
Issues = "https://github.com/armbues/mlx-decision/issues"
Changelog = "https://github.com/armbues/mlx-decision/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mlx_decision/__init__.py"

[project.scripts]
mlx-decision = "mlx_decision.cli:app"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Copied from mlx-lm; kept close to upstream so they can be diffed.
extend-exclude = [
    "src/mlx_decision/backbones/qwen3_5/activations.py",
    "src/mlx_decision/backbones/qwen3_5/base.py",
    "src/mlx_decision/backbones/qwen3_5/cache.py",
    "src/mlx_decision/backbones/qwen3_5/gated_delta.py",
    "src/mlx_decision/backbones/qwen3_5/qwen3_5.py",
    "src/mlx_decision/backbones/qwen3_5/qwen3_next.py",
    "src/mlx_decision/backbones/qwen3_5/rope_utils.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests run only when asked for: pytest -m slow (make test-slow).
addopts = "-m 'not slow'"
markers = [
    "weights: needs the model weights (skipped when they are absent)",
    "slow: takes minutes; deselected unless asked for with -m slow",
]
