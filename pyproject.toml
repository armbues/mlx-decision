[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-decision"
version = "0.1.0"
description = "Run and train decision models on Apple Silicon with MLX"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = [
    "mlx>=0.32",
    "tokenizers",
    "huggingface_hub",
    "pydantic>=2",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
mlx-decision = "mlx_decision.cli:app"
